<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>brink tests</title>
<style>
  body {
    background: #17191c;
    color: #d9d6cf;
    font: 14px/1.7 ui-monospace, "SF Mono", Menlo, monospace;
    padding: 24px;
    max-width: 760px;
    margin: 0 auto;
  }
  h1 { font-size: 15px; color: #f4f1ea; font-weight: 600; }
  #summary { margin: 14px 0 18px; font-weight: 600; }
  #summary.green { color: #7fb069; }
  #summary.red { color: #e2574c; }
  li { list-style: none; }
  .pass { color: #7fb069; }
  .fail { color: #e2574c; }
  iframe { position: absolute; left: -12000px; width: 1200px; height: 800px; border: 0; }
</style>
</head>
<body>
<h1>brink test suite</h1>
<div id="summary">running, exports take a few seconds...</div>
<ul id="log"></ul>

<script>
'use strict';

const logEl = document.getElementById('log');
let passed = 0, failed = 0;

function report(name, err) {
  const li = document.createElement('li');
  li.className = err ? 'fail' : 'pass';
  li.textContent = `${err ? 'fail' : 'pass'}  ${name}${err ? `  (${err})` : ''}`;
  logEl.appendChild(li);
  err ? failed++ : passed++;
}

function ok(cond, msg) { if (!cond) throw new Error(msg); }
function eq(a, b, msg) { if (a !== b) throw new Error(`${msg}: got ${a}, want ${b}`); }
function close(a, b, tol, msg) { if (Math.abs(a - b) > tol) throw new Error(`${msg}: got ${a}, want ~${b}`); }

// pixel comparisons must read in the same color space the app renders in
const CS = (() => {
  try {
    const probe = document.createElement('canvas').getContext('2d', { colorSpace: 'display-p3' });
    return probe.getContextAttributes && probe.getContextAttributes().colorSpace === 'display-p3'
      ? 'display-p3' : 'srgb';
  } catch {
    return 'srgb';
  }
})();

const wait = (ms) => new Promise((r) => setTimeout(r, ms));
async function until(fn, ms, msg) {
  const t0 = performance.now();
  while (performance.now() - t0 < ms) { if (fn()) return; await wait(50); }
  throw new Error(msg);
}

async function photo(w, h, name) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const x = c.getContext('2d', { colorSpace: CS });
  x.fillStyle = '#3a6ea5'; x.fillRect(0, 0, w, h);
  x.fillStyle = '#e08b5a'; x.fillRect(0, 0, w, Math.round(h / 3));
  const blob = await new Promise((r) => c.toBlob(r, 'image/jpeg', 0.9));
  return new File([blob], name, { type: 'image/jpeg' });
}

let frames = [];
async function freshAppAt(width, ...photos) {
  const frame = document.createElement('iframe');
  frame.style.width = width + 'px';
  document.body.appendChild(frame);
  frames.push(frame);
  await new Promise((res, rej) => { frame.onload = res; frame.onerror = rej; frame.src = 'index.html'; });
  const win = frame.contentWindow;
  if (photos.length) await win.addFiles(photos);
  return { win, doc: frame.contentDocument, B: win.brink };
}
const freshApp = (...photos) => freshAppAt(1200, ...photos);

function pev(win, el, type, id, x, y) {
  el.dispatchEvent(new win.PointerEvent(type, {
    pointerId: id, clientX: x, clientY: y, bubbles: true, isPrimary: id === 1,
  }));
}

const suite = [];
function test(name, fn) { suite.push({ name, fn }); }

/* ---------- loading ---------- */

test('loads photos, shows preview and thumbnails', async () => {
  const { doc, B } = await freshApp(await photo(800, 1200, 'a.jpg'), await photo(1200, 800, 'b.jpg'));
  eq(B.state.images.length, 2, 'images');
  eq(doc.getElementById('preview').style.display, 'block', 'preview shown');
  eq(doc.querySelectorAll('.thumb').length, 2, 'thumbnails');
});

test('caps the set at 20 photos and says so', async () => {
  const files = [];
  for (let i = 0; i < 22; i++) files.push(await photo(80, 120, `p${i}.jpg`));
  const { doc, B } = await freshApp(...files);
  eq(B.state.images.length, 20, 'capped');
  ok(doc.getElementById('readout').textContent.includes('20 photos max'), 'cap notice shown');
  eq(doc.querySelectorAll('.thumb-add').length, 0, 'add tile gone at the limit');
  const before = B.state.images.length;
  await doc.defaultView.addFiles([await photo(80, 120, 'extra.jpg')]);
  eq(B.state.images.length, before, 'nothing sneaks past the cap');
  ok(doc.getElementById('readout').textContent.includes('20 photos max'), 'trying again repeats the notice');
  doc.querySelector('.rm').click();
  eq(doc.querySelectorAll('.thumb-add').length, 1, 'add tile returns after removing one');
});

test('unreadable files are reported, good ones still load', async () => {
  const bad = new File([new Uint8Array([1, 2, 3])], 'broken.jpg', { type: 'image/jpeg' });
  const { doc, B } = await freshApp(bad, await photo(400, 600, 'good.jpg'));
  eq(B.state.images.length, 1, 'good one loaded');
  ok(doc.getElementById('readout').textContent.includes('could not read broken.jpg'), 'failure notice shown');
});

/* ---------- singles geometry ---------- */

test('fit hits every ratio exactly and never rescales the photo', async () => {
  const { win, B } = await freshApp(await photo(800, 1200, 'a.jpg'));
  const img = B.state.images[0];
  for (const [mode, ratio] of [['post', 4 / 5], ['grid', 3 / 4], ['square', 1], ['wide', 1.91], ['story', 9 / 16]]) {
    B.state.mode = mode;
    const l = win.layoutFor(img);
    close(l.cw / l.ch, ratio, 0.002, `${mode} ratio`);
    eq(l.dw, 800, `${mode} keeps width`);
    eq(l.dh, 1200, `${mode} keeps height`);
  }
  B.state.mode = 'original';
  const l = win.layoutFor(img);
  eq(l.m, Math.round(0.02 * 1200), 'border is 2 percent of the long side');
  eq(l.cw, 800 + 2 * l.m, 'as shot adds border only');
});

test('position grid leaves exactly one border at the chosen edge', async () => {
  const { win, B } = await freshApp(await photo(1200, 800, 'a.jpg'));
  const img = B.state.images[0];
  B.state.mode = 'post';
  B.state.alignV = 'bottom';
  let l = win.layoutFor(img);
  eq(l.ch - l.dh - l.y, l.m, 'bottom gap equals border');
  B.state.alignV = 'top';
  l = win.layoutFor(img);
  eq(l.y, l.m, 'top gap equals border');
  B.state.alignV = 'center';
});

test('fill crops to the ratio, clamps panning, zoom shrinks the source window', async () => {
  const { win, B } = await freshApp(await photo(800, 1200, 'a.jpg'));
  const img = B.state.images[0];
  B.state.mode = 'post';
  B.state.fit = 'fill';
  let l = win.layoutFor(img);
  close(l.cw / l.ch, 0.8, 0.002, 'fill ratio');
  eq(l.dw, 800, 'full width kept');
  ok(l.trimH > 0, 'height trimmed');
  img.adj.dy = 99999;
  l = win.layoutFor(img);
  ok(l.sy <= 1200 - l.sh + 0.01, 'pan clamped to the photo');
  const swAt1 = l.sw;
  img.adj.zoom = 2;
  l = win.layoutFor(img);
  close(l.sw, swAt1 / 2, 1, 'zoom x2 halves the source window');
  eq(l.cw, win.layoutFor(img).cw, 'canvas size unchanged by zoom');
  win.resetFraming();
  eq(img.adj.zoom, 1, 'reset restores zoom');
  eq(img.adj.dy, 0, 'reset restores pan');
});

test('rotation scales just enough to leave no gaps and resets clean', async () => {
  const { win, doc, B } = await freshApp(await photo(800, 1200, 'a.jpg'));
  const img = B.state.images[0];
  B.state.mode = 'post';
  B.state.fit = 'fill';
  const flat = win.layoutFor(img);
  doc.getElementById('rot').value = 30;
  doc.getElementById('rot').dispatchEvent(new Event('input', { bubbles: true }));
  const l = win.layoutFor(img);
  const rad = Math.PI / 6, ac = Math.cos(rad), as = Math.sin(rad);
  const k = Math.max((l.dw * ac + l.dh * as) / l.dw, (l.dw * as + l.dh * ac) / l.dh);
  close(l.f, k, 0.01, 'cover factor');
  eq(l.cw, flat.cw, 'canvas width unchanged by rotation');
  eq(l.ch, flat.ch, 'canvas height unchanged by rotation');
  img.adj.dy = 99999;
  const l2 = win.layoutFor(img);
  const hy = (l2.dw * as + l2.dh * ac) / (2 * l2.f);
  ok(l2.ucy + hy <= 1200 + 0.01, 'rotated sample clamped inside the photo');
  win.resetFraming();
  eq(img.adj.rot, 0, 'reset clears rotation');
  eq(doc.getElementById('rotVal').textContent, '0\u00b0', 'slider label synced');
});

test('the position grid disables directions with no room', async () => {
  const { doc, B } = await freshApp(await photo(800, 1200, 'a.jpg'));
  const cell = (h, v) => doc.querySelector(`#alignGrid button[data-h="${h}"][data-v="${v}"]`);
  // vertical photo in 4:5 fit: only horizontal slack
  ok(!cell('left', 'center').disabled, 'left lives');
  ok(cell('center', 'top').disabled, 'top is dead');
  ok(!cell('center', 'center').disabled, 'center always lives');
  ok(cell('left', 'top').disabled, 'corners need both axes');
  // as shot: no slack anywhere
  B.state.mode = 'original';
  doc.querySelector('input[name="mode"][value="original"]').click();
  ok(cell('left', 'center').disabled && cell('center', 'top').disabled, 'all dead in as shot');
  // fill flips the rule to the trimmed axis
  B.state.mode = 'post';
  doc.getElementById('fillBtn').click();
  ok(!cell('center', 'top').disabled, 'vertical gravity lives in fill');
  ok(cell('left', 'center').disabled, 'no horizontal trim, no horizontal gravity');
});

test('rotation snaps to zero on the slider, typed angles are exact', async () => {
  const { win, doc, B } = await freshApp(await photo(400, 600, 'a.jpg'));
  doc.getElementById('fillBtn').click();
  const img = B.state.images[0];
  const rot = doc.getElementById('rot');
  rot.value = 1.5;
  rot.dispatchEvent(new Event('input', { bubbles: true }));
  eq(img.adj.rot, 0, 'small angles snap to zero');
  rot.value = 30;
  rot.dispatchEvent(new Event('input', { bubbles: true }));
  eq(img.adj.rot, 30, 'real angles pass through');
  doc.getElementById('rotVal').click();
  const inp = doc.querySelector('.val-edit input');
  ok(inp, 'tapping the value opens direct entry');
  inp.value = '-1,3';
  inp.dispatchEvent(new win.KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
  eq(img.adj.rot, -1.3, 'typed angle lands exactly, comma and minus welcome');
  ok(!doc.querySelector('.val-edit'), 'editor closes on enter');
  eq(doc.getElementById('rotVal').textContent, '-1.3°', 'label follows');
});

test('the rotated export keeps the photo center in place', async () => {
  const { win, doc, B } = await freshApp(await photo(400, 600, 'a.jpg'));
  B.state.format = 'png';
  B.state.fit = 'fill';
  const img = B.state.images[0];
  img.adj.rot = 30;
  const l = win.layoutFor(img);
  const bmp = await createImageBitmap(await win.exportBlob(img));
  const c = document.createElement('canvas');
  c.width = bmp.width; c.height = bmp.height;
  const x = c.getContext('2d', { colorSpace: CS });
  x.drawImage(bmp, 0, 0);
  const px = x.getImageData(Math.round(l.x + l.dw / 2), Math.round(l.y + l.dh / 2), 1, 1).data;
  const ref = document.createElement('canvas');
  ref.width = 400; ref.height = 600;
  const rx = ref.getContext('2d', { colorSpace: CS });
  rx.drawImage(img.bitmap, 0, 0);
  const want = rx.getImageData(200, 300, 1, 1).data;
  for (let i = 0; i < 3; i++) ok(Math.abs(px[i] - want[i]) <= 8, `channel ${i}: ${px[i]} vs ${want[i]}`);
});

test('two finger twist rotates, plain pinch stays straight', async () => {
  const { win, doc, B } = await freshApp(await photo(400, 600, 'a.jpg'));
  doc.getElementById('fillBtn').click();
  const img = B.state.images[0];
  const pv = doc.getElementById('preview');
  const r = pv.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  // twist: second finger sweeps 30 degrees at constant distance
  pev(win, pv, 'pointerdown', 1, cx - 40, cy);
  pev(win, pv, 'pointerdown', 2, cx + 40, cy);
  pev(win, pv, 'pointermove', 2, cx - 40 + 80 * Math.cos(Math.PI / 6), cy + 80 * Math.sin(Math.PI / 6));
  ok(img.adj.rot > 20 && img.adj.rot < 32, `twist rotated ${img.adj.rot}`);
  close(img.adj.zoom, 1, 0.05, 'distance held, zoom untouched');
  pev(win, pv, 'pointerup', 1, cx - 40, cy);
  pev(win, pv, 'pointerup', 2, cx, cy);
  // plain pinch: distance grows on the same axis, no angle change
  win.resetFraming();
  pev(win, pv, 'pointerdown', 1, cx - 20, cy);
  pev(win, pv, 'pointerdown', 2, cx + 20, cy);
  pev(win, pv, 'pointermove', 2, cx + 60, cy);
  ok(img.adj.zoom > 1.5, 'pinch zoomed');
  eq(img.adj.rot, 0, 'no accidental rotation');
  pev(win, pv, 'pointerup', 1, cx - 20, cy);
  pev(win, pv, 'pointerup', 2, cx + 60, cy);
});

test('fit keeps the photo footprint while zoom and rotation crop inside it', async () => {
  const { win, B } = await freshApp(await photo(800, 1200, 'a.jpg'));
  const img = B.state.images[0];
  const flat = win.layoutFor(img);
  img.adj.zoom = 2;
  let l = win.layoutFor(img);
  eq(l.cw, flat.cw, 'canvas unchanged');
  eq(l.dw, flat.dw, 'photo window unchanged');
  close(l.sw, 400, 1, 'zoom halves the visible source');
  ok(l.trimW > 0, 'crop reported');
  img.adj.rot = 45;
  l = win.layoutFor(img);
  eq(l.dw, flat.dw, 'rotation keeps the footprint');
  ok(l.f > 2, 'rotation scales up inside the window');
  win.resetFraming();
  l = win.layoutFor(img);
  close(l.sw, 800, 0.01, 'reset restores the full photo');
});

/* ---------- export ---------- */

test('exports match the computed size, format and filename', async () => {
  const { win, B } = await freshApp(await photo(800, 1200, 'a.jpg'));
  const img = B.state.images[0];
  const l = win.layoutFor(img);
  let blob = await win.exportBlob(img);
  let bmp = await createImageBitmap(blob);
  eq(bmp.width, l.cw, 'export width');
  eq(bmp.height, l.ch, 'export height');
  eq(blob.type, 'image/jpeg', 'jpeg by default');
  eq(win.outName(img), 'a-4x5.jpg', 'filename suffix');
  B.state.format = 'png';
  blob = await win.exportBlob(img);
  eq(blob.type, 'image/png', 'png when selected');
  eq(win.outName(img), 'a-4x5.png', 'png extension');
});

test('save buttons trigger the right downloads', async () => {
  const { win, doc } = await freshApp(await photo(400, 600, 'a.jpg'), await photo(600, 400, 'b.jpg'));
  const fired = [];
  win.HTMLAnchorElement.prototype.click = function () { fired.push(this.download); };
  doc.getElementById('download').click();
  await until(() => fired.length === 1, 8000, 'save image never fired');
  eq(fired[0], 'b-4x5.jpg', 'saves the selected photo');
  await until(() => doc.getElementById('readout').textContent.includes('saved b-4x5.jpg'), 3000, 'no confirmation after saving');
  doc.getElementById('downloadAll').click();
  await until(() => fired.length === 3, 15000, 'save all did not fire for every photo');
  ok(fired.includes('a-4x5.jpg'), 'first photo saved');
  await until(() => doc.getElementById('readout').textContent.includes('saved 2 photos'), 3000, 'no confirmation after save all');
});

/* ---------- collage ---------- */

test('collage sizes the canvas so no photo upscales', async () => {
  const { win, doc, B } = await freshApp(await photo(800, 1200, 'a.jpg'), await photo(1200, 800, 'b.jpg'));
  doc.getElementById('wsCollage').click();
  for (const tpl of ['2h', '2v']) {
    doc.querySelector(`#tplRow button[data-tpl="${tpl}"]`).click();
    const c = win.computeCollage();
    close(c.W / c.H, 0.8, 0.002, `${tpl} canvas ratio`);
    c.imgs.forEach((img, i) => {
      if (!img) return;
      const [, , w, h] = c.rects[i];
      ok(Math.max(w / img.bitmap.width, h / img.bitmap.height) <= 1.001, `${tpl} slot ${i} not upscaled`);
    });
  }
});

test('a 2x2 grid works with 2 photos, empty cells stay empty', async () => {
  const { win, doc, B } = await freshApp(await photo(400, 600, 'a.jpg'), await photo(600, 400, 'b.jpg'));
  doc.getElementById('wsCollage').click();
  doc.querySelector('#tplRow button[data-tpl="4g"]').click();
  const c = win.computeCollage();
  eq(c.imgs.length, 4, 'four cells');
  eq(c.imgs.filter(Boolean).length, 2, 'two filled');
  close(c.W / c.H, 0.8, 0.002, 'ratio holds with empties');
});

test('cells reassign, swap and empty via thumbnail taps', async () => {
  const { doc, B } = await freshApp(await photo(400, 600, 'a.jpg'), await photo(600, 400, 'b.jpg'));
  doc.getElementById('wsCollage').click();
  const names = () => B.state.slotMap.map((s) => (s ? s.name : null)).join(',');
  eq(names(), 'a.jpg,b.jpg', 'auto fill');
  B.state.slot = 0;
  doc.querySelectorAll('.thumb')[1].click();       // put b in cell 1: swap
  eq(names(), 'b.jpg,a.jpg', 'swap');
  doc.querySelectorAll('.thumb')[1].click();       // same again: empty the cell
  eq(names(), ',a.jpg', 'emptied');
  doc.querySelectorAll('.thumb')[1].click();       // and back
  eq(names(), 'b.jpg,a.jpg', 'refilled');
});

test('tapping a cell selects it, pinch zooms only that cell', async () => {
  const { win, doc, B } = await freshApp(await photo(400, 600, 'a.jpg'), await photo(400, 600, 'b.jpg'));
  doc.getElementById('wsCollage').click();
  const pv = doc.getElementById('preview');
  const r = pv.getBoundingClientRect();
  const cx = r.left + r.width * 0.25, cy = r.top + r.height / 2;   // inside cell 1
  pev(win, pv, 'pointerdown', 1, cx - 15, cy);
  pev(win, pv, 'pointerdown', 2, cx + 15, cy);                     // second finger keeps the cell
  eq(B.state.slot, 0, 'cell 1 stays selected');
  pev(win, pv, 'pointermove', 2, cx + 45, cy);                     // pinch out: distance 30 to 60
  close(B.state.slotMap[0].cadj.zoom, 2, 0.05, 'pinch doubled the zoom');
  eq(B.state.slotMap[1].cadj.zoom, 1, 'other cell untouched');
  pev(win, pv, 'pointerup', 1, cx - 15, cy);
  const dyBefore = B.state.slotMap[0].cadj.dy;
  pev(win, pv, 'pointermove', 2, cx + 45, cy + 60);                // one finger pans
  ok(B.state.slotMap[0].cadj.dy !== dyBefore, 'single finger pans the cell');
  pev(win, pv, 'pointerup', 2, cx + 45, cy + 60);
});

test('thumbnail taps switch the selected photo', async () => {
  const { doc, B } = await freshApp(await photo(400, 600, 'a.jpg'), await photo(600, 400, 'b.jpg'), await photo(500, 500, 'c.jpg'));
  eq(B.state.current, 2, 'last added starts selected');
  doc.querySelectorAll('.thumb')[0].click();
  eq(B.state.current, 0, 'tap selects the first');
  doc.querySelectorAll('.thumb')[1].click();
  eq(B.state.current, 1, 'tap selects the second');
});

test('remove button shows only on the selected thumbnail', async () => {
  const { doc } = await freshApp(await photo(400, 600, 'a.jpg'), await photo(600, 400, 'b.jpg'), await photo(500, 500, 'c.jpg'));
  const visible = () => [...doc.querySelectorAll('.rm')].filter((b) => doc.defaultView.getComputedStyle(b).display !== 'none');
  eq(visible().length, 1, 'exactly one visible remove button');
  ok(doc.querySelectorAll('.thumbwrap')[2].contains(visible()[0]), 'it sits on the selected photo');
  doc.querySelectorAll('.thumb')[0].click();
  ok(doc.querySelectorAll('.thumbwrap')[0].contains(visible()[0]), 'it follows the selection');
});

test('nothing covers the thumbnails', async () => {
  const { doc } = await freshApp(await photo(400, 600, 'a.jpg'), await photo(600, 400, 'b.jpg'), await photo(500, 500, 'c.jpg'));
  await until(() => doc.querySelectorAll('.thumb')[0].getBoundingClientRect().width > 20, 3000, 'thumbnails never laid out');
  for (const t of doc.querySelectorAll('.thumb')) {
    const r = t.getBoundingClientRect();
    const el = doc.elementFromPoint(r.left + r.width / 2, r.top + r.height / 2);
    ok(el === t || t.contains(el), `thumb center hits ${el ? el.className || el.tagName : 'nothing'}`);
  }
});

test('photos can be removed, removing the last restores the empty state', async () => {
  const { doc, B } = await freshApp(await photo(400, 600, 'a.jpg'), await photo(600, 400, 'b.jpg'));
  doc.querySelectorAll('.rm')[0].click();
  eq(B.state.images.length, 1, 'one removed');
  eq(B.state.images[0].name, 'b.jpg', 'the right one stays');
  doc.querySelectorAll('.rm')[0].click();
  eq(B.state.images.length, 0, 'all removed');
  ok(doc.getElementById('empty').offsetParent !== null, 'empty state restored');
  eq(doc.getElementById('preview').style.display, 'none', 'preview hidden');
});

test('removing a collage photo empties its cell', async () => {
  const { doc, B } = await freshApp(await photo(400, 600, 'a.jpg'), await photo(600, 400, 'b.jpg'), await photo(500, 500, 'c.jpg'));
  doc.getElementById('wsCollage').click();
  doc.querySelectorAll('.rm')[1].click();          // remove b.jpg
  const names = B.state.slotMap.map((s) => (s ? s.name : null));
  eq(names.join(','), 'a.jpg,', 'cell emptied, not reshuffled');
  eq(B.state.images.length, 2, 'photo gone from the strip');
});

test('the desktop header credits the author and links the repo', async () => {

/* ---------- film frames ---------- */

test('film frames are deterministic per photo, another frame cycles the set', async () => {
  const { win, doc, B } = await freshApp(await photo(400, 600, 'a.jpg'));
  B.state.format = 'png';
  doc.querySelector('#frameRow button[data-frame="film"]').click();
  const img = B.state.images[0];
  const bytes = async () => new Uint8Array(await (await win.exportBlob(img)).arrayBuffer());
  const a = await bytes();
  const b = await bytes();
  ok(a.length === b.length && a.every((v, i) => v === b[i]), 'same frame twice, identical bytes');

  const g = doc.querySelector('.val-edit input');
  g.value = '400';
  doc.querySelector('.val-edit button').click();
  eq(B.state.images[0].grain, 100, 'values clamp to the slider range');
});

test('the desktop sidebar mirrors the mobile tool order', async () => {
  const { doc } = await freshApp(await photo(400, 600, 'a.jpg'));
  const seq = [...doc.querySelectorAll('aside > [data-tab]')].map((s) => s.dataset.tab).join(',');
  eq(seq, 'format,format,format,border,frame,color,film,grain,mat,split,save,save', 'section order');
});

/* ---------- interface state ---------- */

test('controls show only what applies in each workspace', async () => {
  const { doc } = await freshApp(await photo(400, 600, 'a.jpg'), await photo(600, 400, 'b.jpg'));
  const vis = (id) => doc.getElementById(id).offsetParent !== null;
  ok(vis('fitRow') && vis('alignGrid') && !vis('tplSection'), 'singles controls');
  doc.getElementById('wsCollage').click();
  ok(!vis('fitRow') && !vis('alignGrid') && !vis('modeOriginal') && vis('tplSection') && vis('zoomRow'), 'collage controls');
  doc.getElementById('wsSingles').click();
  ok(vis('fitRow') && vis('alignGrid') && vis('modeOriginal'), 'singles restored');
});

test('preview background toggles between dark and light', async () => {
  const { doc } = await freshApp(await photo(400, 600, 'a.jpg'));
  const table = doc.getElementById('table');
  doc.getElementById('bgToggle').click();
  ok(table.classList.contains('light'), 'light background on');
  doc.getElementById('bgToggle').click();
  ok(!table.classList.contains('light'), 'back to dark');
});

/* ---------- run ---------- */

(async () => {
  for (const { name, fn } of suite) {
    try { await fn(); report(name); }
    catch (err) { report(name, err.message); }
    for (const f of frames) f.remove();
    frames = [];
  }
  const summary = document.getElementById('summary');
  summary.textContent = `${passed} passed, ${failed} failed`;
  summary.className = failed ? 'red' : 'green';
  document.title = failed ? `brink tests, ${failed} failed` : 'brink tests, all green';
})();
</script>
